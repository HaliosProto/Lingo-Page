<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Translation Extension Fixture</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 32px;
      }
      main {
        max-width: 700px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Stable fixture heading</h1>
      <p id="paragraph">This page changes only after an explicit translation request.</p>
      <p id="whitespace">Whitespace must survive restoration.</p>
      <p translate="no" id="notranslate">ProductName must stay unchanged.</p>
      <code id="code">const doNotTranslate = true;</code>
      <canvas id="protected-canvas" aria-label="Chart rendered as pixels"></canvas>
      <label>Account number <input id="account" value="1234 5678 9012" /></label>
      <button type="button">A page control</button>
      <div id="dynamic"></div>
      <div id="bulk"></div>
    </main>
    <script>
      window.addDynamicText = () => {
        const paragraph = document.createElement('p');
        paragraph.id = 'dynamic-paragraph';
        paragraph.textContent = 'New content arrived after initial translation.';
        document.querySelector('#dynamic').append(paragraph);
      };
      window.addBulkText = (count) => {
        const container = document.querySelector('#bulk');
        for (let index = 0; index < count; index += 1) {
          const paragraph = document.createElement('p');
          paragraph.id = `bulk-${index}`;
          paragraph.textContent = `Bulk section ${index} remains stable.`;
          container.append(paragraph);
        }
      };
      window.addChangedSection = () => {
        const paragraph = document.createElement('p');
        paragraph.id = 'changed-section';
        paragraph.textContent = 'A deliberately added section needs translation.';
        document.querySelector('#dynamic').append(paragraph);
      };
      window.modifyFixtureParagraph = () => {
        document.querySelector('#paragraph').textContent =
          'This paragraph was deliberately modified after translation.';
      };
      window.reorderFixtureHeading = () => {
        const heading = document.querySelector('#heading');
        document.querySelector('main').append(heading);
      };
      window.removeFixtureWhitespace = () => {
        document.querySelector('#whitespace').remove();
      };
      window.addMixedDirectionText = () => {
        const paragraph = document.createElement('p');
        paragraph.id = 'mixed-direction';
        paragraph.textContent =
          'Persian فارسی model XJ-2026, https://example.com/path and number ۱۲۳۴.';
        document.querySelector('#dynamic').append(paragraph);
      };
      window.addBidiTestMatrix = () => {
        const section = document.createElement('section');
        section.id = 'bidi-test-matrix';

        const englishToPersian = document.createElement('p');
        englishToPersian.id = 'bidi-english-persian';
        englishToPersian.dir = 'auto';
        englishToPersian.textContent = 'English sentence with Persian فارسی and model PX-2026.';

        const arabic = document.createElement('p');
        arabic.id = 'bidi-arabic-numbers';
        arabic.dir = 'auto';
        arabic.textContent = 'النص العربي مع الرقم ١٢٣٤ والرمز AR-42.';

        const hebrew = document.createElement('p');
        hebrew.id = 'bidi-hebrew-url';
        hebrew.dir = 'auto';
        hebrew.textContent = 'טקסט עברי עם https://example.com/path והדגם HX-9.';

        const list = document.createElement('ul');
        list.id = 'bidi-list';
        const listItem = document.createElement('li');
        listItem.textContent = 'List item فارسی with tag #release-2026.';
        list.append(listItem);

        const table = document.createElement('table');
        table.id = 'bidi-table';
        const row = table.insertRow();
        row.insertCell().textContent = 'جدول ۲۰۲۶';
        row.insertCell().textContent = 'SKU TB-44';

        const button = document.createElement('button');
        button.id = 'bidi-button';
        button.type = 'button';
        button.textContent = 'Continue ادامه';

        section.append(englishToPersian, arabic, hebrew, list, table, button);
        document.querySelector('#dynamic').append(section);
      };
      window.addDuplicateDynamicText = () => {
        for (let index = 0; index < 2; index += 1) {
          const paragraph = document.createElement('p');
          paragraph.id = `duplicate-dynamic-${index}`;
          paragraph.textContent = 'Duplicated dynamic text requires a confident match.';
          document.querySelector('#dynamic').append(paragraph);
        }
      };
      const initialBulkCount = Number(new URLSearchParams(location.search).get('bulk') ?? 0);
      if (Number.isInteger(initialBulkCount) && initialBulkCount > 0 && initialBulkCount <= 2200) {
        window.addBulkText(initialBulkCount);
      }
    </script>
  </body>
</html>
